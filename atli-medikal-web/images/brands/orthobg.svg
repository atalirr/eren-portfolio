<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" width="360" height="140" role="img" aria-label="OrthoBG">
  <rect width="360" height="140" rx="12" fill="#FFFFFF"/>
  <!-- Made in Turkey badge (top right) -->
  <g transform="translate(210, 12)">
    <text x="0" y="13" font-family="'Segoe Script', 'Brush Script MT', cursive, sans-serif" font-size="11" font-weight="700" fill="#27272A" letter-spacing="0.03em">Made in</text>
    <text x="6" y="29" font-family="'Segoe Script', 'Brush Script MT', cursive, sans-serif" font-size="19" font-weight="800" fill="#18181B">Turkey</text>
    <path d="M52,6 C58,2 67,4 70,10 C65,8 57,9 52,14 Z" fill="#E11D48"/>
    <circle cx="64" cy="11" r="2.2" fill="#E11D48"/>
  </g>
  <!-- OrthoBG main logo -->
  <g transform="translate(28, 38)">
    <!-- O -->
    <text x="0" y="64" font-family="'Plus Jakarta Sans', 'Arial Rounded MT Bold', Arial, sans-serif" font-size="58" font-weight="800" fill="#E88835">Or</text>
    <!-- Stylized human figure 't' with raised arms -->
    <g transform="translate(70, 4)">
      <!-- Head -->
      <circle cx="22" cy="11" r="5.5" fill="#E88835"/>
      <!-- Left & Right raised arms -->
      <path d="M6,4 L20,21 L39,3" fill="none" stroke="#E88835" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Torso / stem of t -->
      <path d="M20,21 L14,60" fill="none" stroke="#E88835" stroke-width="7.5" stroke-linecap="round"/>
    </g>
    <!-- ho -->
    <text x="103" y="64" font-family="'Plus Jakarta Sans', 'Arial Rounded MT Bold', Arial, sans-serif" font-size="58" font-weight="800" fill="#E88835">ho</text>
    <!-- BG -->
    <text x="180" y="64" font-family="'Plus Jakarta Sans', 'Arial Rounded MT Bold', Arial, sans-serif" font-size="58" font-weight="800" fill="#E1467C">BG</text>
  </g>
  <text x="180" y="124" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="700" fill="#71717A" letter-spacing="0.16em">ORTOPEDİ &amp; KORSE SİSTEMLERİ</text>
</svg>
